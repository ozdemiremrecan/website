<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@emrecan-ozdemir:~</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0c0c0c;
            --term-green: #33ff00;
            --term-glow: #33ff0080;
            --term-dim: #1a8000;
            --term-blue: #00bfff;
            --term-yellow: #ffd700;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 5px var(--term-glow);
            display: flex;
            flex-direction: column;
        }

        /* CRT Ekran Efekti */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #terminal {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            height: 100%;
            overflow-y: auto;
            padding-bottom: 50px;
            position: relative;
            z-index: 1;
        }

        /* Scrollbar gizleme */
        #terminal::-webkit-scrollbar { width: 8px; }
        #terminal::-webkit-scrollbar-thumb { background: var(--term-dim); }

        .log-line { margin-bottom: 5px; opacity: 0.9; line-height: 1.4; }
        
        .ascii-art {
            white-space: pre;
            color: var(--term-green);
            font-size: 10px;
            line-height: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        @media (min-width: 600px) { .ascii-art { font-size: 14px; line-height: 14px; } }

        .highlight { color: #fff; font-weight: bold; }
        .info { color: var(--term-blue); }
        .warn { color: var(--term-yellow); }
        .error { color: #ff3333; }
        .link { color: #fff; text-decoration: underline; cursor: pointer; }

        .input-line { display: flex; align-items: center; margin-top: 10px; }
        .prompt { margin-right: 10px; color: var(--term-green); }

        input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            flex: 1;
            outline: none;
            text-shadow: 0 0 5px var(--term-glow);
            caret-color: var(--term-green);
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div id="output"></div>
        
        <div class="input-line" id="input-container" style="display:none;">
            <span class="prompt">guest@emrecan-ozdemir:~$</span>
            <input type="text" id="commandInput" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const inputContainer = document.getElementById('input-container');
        const input = document.getElementById('commandInput');
        const terminal = document.getElementById('terminal');

        // Emre Can Özdemir için Özel Açılış Sekansı
        const bootSequence = [
            { text: "System Boot Initialized...", delay: 300 },
            { text: "Loading Kernel Modules: Java, Spring Boot, Angular...", delay: 400 },
            { text: "   ___                      ___             ", delay: 100, isAscii: true },
            { text: "  / _ \\_ __ ___  _ __ ___  / __\\__ _ _ __   ", delay: 100, isAscii: true },
            { text: " / /_)/ '_ ` _ \\| '__/ _ \\/ /  / _` | '_ \\  ", delay: 100, isAscii: true },
            { text: "/ ___/| | | | | | | |  __/ /__| (_| | | | | ", delay: 100, isAscii: true },
            { text: "\\/    |_| |_| |_|_|  \\___\\____/\\__,_|_| |_| ", delay: 100, isAscii: true },
            { text: " :: Emre Can Ozdemir ::    (Software Dev)", delay: 300 },
            { text: "[INFO] Connecting to RabbitMQ Message Broker... [OK]", delay: 500 },
            { text: "[INFO] Initializing MongoDB & Elasticsearch Cluster... [OK]", delay: 600 },
            { text: "[INFO] Loading Microservices (Geovision Architecture)... [DONE]", delay: 400 },
            { text: "[INFO] Verifying Blockchain Integrations (Solidity)... [VERIFIED]", delay: 400 },
            { text: "[INFO] Beykent University Credentials Loaded (GPA: 3.04)", delay: 300 },
            { text: "<br><span class='highlight'>Sistem Hazır.</span> Komutları görmek için <span class='highlight'>'help'</span> yazın.", delay: 100 }
        ];

        let i = 0;

        function runBootSequence() {
            if (i < bootSequence.length) {
                const line = bootSequence[i];
                const div = document.createElement('div');
                div.className = line.isAscii ? 'ascii-art' : 'log-line';
                div.innerHTML = line.text;
                output.appendChild(div);
                terminal.scrollTop = terminal.scrollHeight;
                i++;
                setTimeout(runBootSequence, line.delay);
            } else {
                inputContainer.style.display = 'flex';
                input.focus();
            }
        }

        // CV Verilerine Göre Komutlar
        const commands = {
            'help': "Mevcut komutlar:<br> - <span class='highlight'>whoami</span>: Özet Biyografi<br> - <span class='highlight'>experience</span>: İş Deneyimleri (Geovision, Turcom)<br> - <span class='highlight'>stack</span>: Teknik Yetenekler<br> - <span class='highlight'>education</span>: Eğitim Bilgileri<br> - <span class='highlight'>contact</span>: İletişim<br> - <span class='highlight'>clear</span>: Ekranı Temizle",
            
            'whoami': "<span class='info'>[SUMMARY]</span> 3 yıldan fazla deneyime sahip Yazılım Geliştirici .<br>Angular ve Spring Boot kullanarak web uygulamaları tasarlama ve geliştirme konusunda tutkuluyum.Temiz kod, sürdürülebilir yazılım ve güvenli, ölçeklenebilir sistemler üzerine odaklanıyorum.",
            
            'experience': `
                <div style='margin-bottom:15px;'>
                    <span class='warn'>[CURRENT] Geovision Group (Oca 2025 - Present) </span><br>
                    - Spring Boot ve Mikroservis mimarisi ile RESTful API geliştirimi.<br>
                    - RabbitMQ ile servisler arası asenkron iletişim.<br>
                    - MongoDB (NoSQL) ile esnek veri yapıları ve Elasticsearch ile veri analitiği.<br>
                    - Docker ile konteynerizasyon ve GitFlow stratejileri.<br>
                    - .NET Framework (MVC) tabanlı uygulamalara katkı.
                </div>
                <div>
                    <span class='warn'>[PREVIOUS] Turcom Technology (Haz 2022 - Ara 2024) </span><br>
                    - AngularJS'ten Modern Angular'a migrasyon, TypeScript dönüşümü.<br>
                    - Blockchain (Solidity) ile akıllı kontrat geliştirme.<br>
                    - Spring Security ile JWT tabanlı kimlik doğrulama.<br>
                    - Bootstrap 4'ten 5'e geçiş ile modern arayüz tasarımı.<br>
                    - Spring Data JPA ile veritabanı yönetimi ve optimizasyon.
                </div>
            `,
            
            'stack': `
                <div><span class='info'>[LANGUAGES]</span> HTML, CSS, JavaScript, TypeScript, Java, C# </div>
                <div><span class='info'>[FRAMEWORKS]</span> Angular, Spring Boot, .NET MVC </div>
                <div><span class='info'>[DATA & SEARCH]</span> PostgreSQL, MongoDB, Elasticsearch, Redis, Hibernate</div>
                <div><span class='info'>[DEVOPS & TOOLS]</span> Docker, RabbitMQ, Git/GitLab, Maven </div>
            `,

            'education': "<span class='warn'>[UNIVERSITY]</span> Beykent Üniversitesi - Bilgisayar Mühendisliği (BS) <br><span class='highlight'>GPA:</span> 3.04/4.0 <br>Eylül 2019 - Haziran 2024 ",
            
            'contact': `
                <span class='highlight'>Email:</span> <a href='mailto:contact@emrecanozdemir.com' class='link'>contact@emrecanozdemir.com</a> <br>
                <span class='highlight'>Web:</span> <a href='https://emrecanozdemir.com' target='_blank' class='link'>emrecanozdemir.com</a> <br>
                <span class='highlight'>LinkedIn:</span> <a href='https://linkedin.com/in/ozdemiremrecan' target='_blank' class='link'>in/ozdemiremrecan</a> <br>
                <span class='highlight'>GitHub:</span> <a href='https://github.com/ozdemiremrecan' target='_blank' class='link'>github.com/ozdemiremrecan</a> <br>
                <span class='highlight'>Tel:</span> 0538 474 28 24 [cite: 41]
            `,
            
            'sudo': "<span class='error'>Erişim reddedildi: Bu sistemde root yetkisi Emre Can'a aittir.</span>",
            'java -version': "java version \"17.0.8\" 2023-07-18 LTS"
        };

        // Input İşleme
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = input.value.trim().toLowerCase();
                const cmdLine = document.createElement('div');
                cmdLine.className = 'log-line';
                cmdLine.innerHTML = `<span class="prompt">guest@emrecan-ozdemir:~$</span> ${input.value}`;
                output.appendChild(cmdLine);

                if (command === 'clear') {
                    output.innerHTML = '';
                } else if (commands[command]) {
                    const response = document.createElement('div');
                    response.className = 'log-line';
                    response.innerHTML = commands[command];
                    output.appendChild(response);
                } else if (command !== "") {
                    const error = document.createElement('div');
                    error.className = 'log-line';
                    error.innerHTML = `<span class='error'>Komut bulunamadı: ${command}</span>. Listeyi görmek için 'help' yazın.`;
                    output.appendChild(error);
                }

                input.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        document.addEventListener('click', () => { input.focus(); });
        runBootSequence();

    </script>
</body>
</html>
